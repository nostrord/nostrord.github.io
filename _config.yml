title: Nostrord
description: "NIP-29 client for decentralized group chat on Nostr"
url: "https://nostrord.com"
baseurl: ""
lang: en

permalink: /blog/:title.html

livereload: true
force_polling: true

image: /assets/img/nostrord-app.png
logo: /assets/img/nostrord.svg

author:
  name: The Nostrord Team

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/img/nostrord-app.png

include:
  - .well-known

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - Makefile

# The github-pages gem defaults to jekyll-theme-primer when no theme is set.
# That theme ships assets/css/style.scss, which competes for the same output path
# as our own stylesheet and sometimes wins, serving normalize.css and rendering
# the site unstyled. We use our own layouts, so no theme.
theme: null
